<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>실험 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="config.js?v=4"></script>
<script src="lab.js?v=4"></script>
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#111827;--tx2:#5b6472;--tx3:#8b93a1;--ln:#e3e7ed;--pri:#4168f6;--pri-bg:#edf1ff;--ok:#1f8a4c;--ok-bg:#e7f6ec;--wa:#a15c00;--wa-bg:#fff3e0;--ai:#5a2bbf;--ai-bg:#f2edff;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:13px;font-weight:700;color:var(--pri)}
h1{margin:2px 0 0;font-size:24px;letter-spacing:-.03em}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.b{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--ln);background:#fff;font-size:14px;font-weight:700;white-space:nowrap}
.b{text-decoration:none;color:inherit}
.b.pri{background:#111827;border-color:#111827;color:#fff}
.b.sm{height:32px;padding:0 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:16px}
.card{min-width:0;padding:18px;border-radius:16px;background:var(--card);box-shadow:0 1px 2px rgba(17,24,39,.04)}
.card h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-weight:500;color:var(--tx3);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{padding:12px;border-radius:12px;background:#f6f7f9}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--tx2)}
label.f{display:block;margin:10px 0 4px;font-size:13px;font-weight:700;color:var(--tx2)}
input.in{width:100%;height:40px;padding:0 12px;border:1px solid var(--ln);border-radius:10px;background:#fff;font-size:14px}
input.in:focus{border-color:var(--pri);outline:0}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.msg{margin:8px 0 0;font-size:13px;color:var(--tx2);min-height:20px}
.msg.ok{color:var(--ok)}.msg.err{color:#c62828}
ol.steps{margin:6px 0 0;padding-left:20px;font-size:13.5px;color:var(--tx2)}
ol.steps li{margin:3px 0}
code{font-size:12.5px;background:#f1f3f6;padding:1px 5px;border-radius:5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 8px;border-bottom:1px solid #eef0f3;text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--tx3);font-weight:700;position:sticky;top:0;background:#fff}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
tr.click{cursor:pointer}tr.click:hover td{background:#f8f9fb}
tr.sel td{background:var(--pri-bg)}
.badge{display:inline-block;padding:2px 8px;border-radius:7px;font-size:12px;font-weight:700;background:#f1f3f6;color:var(--tx2)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.wa{background:var(--wa-bg);color:var(--wa)}.badge.x{background:#f6f6f6;color:#aaa;text-decoration:line-through}
.badge.p1{background:var(--ai-bg);color:var(--ai)}
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child{text-align:left;font-weight:800}
.mx .cell{display:flex;flex-direction:column;align-items:center;gap:3px}
.mx .cell span{font-size:12.5px}
.links{display:grid;gap:6px}
.lk{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;font-size:13.5px}
.lk span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl{max-height:460px;overflow:auto;margin-top:6px;border:1px solid #eef0f3;border-radius:10px}
.tl table td{white-space:normal}
.empty{padding:24px;text-align:center;color:var(--tx3)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters select{height:34px;padding:0 8px;border:1px solid var(--ln);border-radius:9px;background:#fff;font-size:13.5px}
.full{grid-column:1/-1}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div><div class="eyebrow">HCI 1조 Skim &amp; Trust</div><h1>실험 관리자</h1></div>
    <div class="acts"><a class="b" href="index.html">실험 시작 화면</a><button class="b" id="refresh">새로고침</button><button class="b" id="dls">세션 CSV</button><button class="b" id="dle">로그 CSV</button></div>
  </header>

  <div class="grid">
    <section class="card full">
      <h2>진행 현황 <small id="upd"></small></h2>
      <div class="kpis" id="kpis"></div>
      <div class="tw" style="margin-top:14px"><table class="mx" id="mx"></table></div>
    </section>

    <section class="card full">
      <h2>세션 기록 <small>행을 누르면 행동 로그가 보여요</small></h2>
      <div class="filters">
        <select id="fp" aria-label="참여자"><option value="">참여자 전체</option></select>
        <select id="fc" aria-label="조건"><option value="">조건 전체</option><option>비교군</option><option>P1</option></select>
        <select id="fs" aria-label="상태"><option value="">제외 기록 숨김</option><option value="all">모두 보기</option></select>
      </div>
      <div class="tw"><table id="tbl"></table></div>
      <div id="detail"></div>
    </section>

    <section class="card">
      <h2>기록 저장 설정</h2>
      <label class="f" for="gas">Apps Script 웹 앱 주소</label>
      <input class="in" id="gas" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
      <label class="f" for="key">관리자 키</label>
      <input class="in" id="key" placeholder="Code.gs의 ADMIN_KEY" autocomplete="off">
      <div class="row"><button class="b pri" id="save">저장하고 연결 확인</button><a class="b" id="sheet" target="_blank" rel="noopener" hidden>구글 시트 열기</a></div>
      <p class="msg" id="smsg"></p>
      <ol class="steps">
        <li>구글 시트를 만들고 [확장 프로그램] &gt; [Apps Script]에 <code>Code.gs</code>를 붙여넣기</li>
        <li>[배포] &gt; [새 배포] &gt; 웹 앱, 실행 사용자 <b>나</b>, 액세스 <b>모든 사용자</b></li>
        <li>나온 주소를 위에 넣고 저장. 실험 기기에서는 아래 '기기 설정 링크'를 한 번 열기</li>
      </ol>
    </section>

    <section class="card">
      <h2>링크</h2>
      <div class="links" id="links"></div>
    </section>
  </div>
</main>
<script>
const $=s=>document.querySelector(s),P=LAB.PRODUCTS,CN=LAB.CONDS,LS=LAB.LS;
const hk=new URLSearchParams(location.hash.slice(1)).get('k');if(hk){LS.set('lab_admin_key',hk);history.replaceState(null,'',location.pathname)}
let SESS=[],sel='';
const key=()=>LS.get('lab_admin_key')||'';
$('#gas').value=LAB.gasUrl();$('#key').value=key();
const nameOf=k=>P[k]?P[k].name:k;
let EVC=null;
function api(q){
  if(q.action==='events'){const sid=q.sid;const p=EVC&&!q.fresh?Promise.resolve(EVC):LAB.get({action:'events',key:key()}).then(j=>{if(!j.ok)throw new Error(j.error);EVC=j;return j});return p.then(j=>({ok:true,rows:sid?j.rows.filter(r=>r.sid===sid):j.rows}))}
  return LAB.get(Object.assign({key:key()},q));
}
function badge(s){const c=s==='완료'?'ok':s==='제외'?'x':s?'wa':'';return `<span class="badge ${c}">${s||'미진행'}</span>`}
function fmt(t){if(!t)return '';const d=new Date(t);return isNaN(d)?t:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function load(){
  if(!LAB.gasUrl()){$('#upd').textContent='저장 주소를 먼저 설정해 주세요';renderAll();return}
  $('#upd').textContent='불러오는 중';
  EVC=null;api({action:'sessions'}).then(j=>{if(!j.ok)throw new Error(j.error);SESS=j.rows;$('#upd').textContent='마지막 갱신 '+fmt(new Date());renderAll()}).catch(e=>{$('#upd').textContent='불러오기 실패: '+e.message;renderAll()});
}
function visible(){const fp=$('#fp').value,fc=$('#fc').value,fs=$('#fs').value;return SESS.filter(r=>(!fp||r.pid===fp)&&(!fc||r.condition===fc)&&(fs==='all'||r.status!=='제외')).sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at)))}
function renderAll(){
  const live=SESS.filter(r=>r.status!=='제외');
  const done=live.filter(r=>r.status==='완료');
  const avg=a=>a.length?(a.reduce((x,y)=>x+(+y||0),0)/a.length).toFixed(1):'-';
  $('#kpis').innerHTML=[[live.length,'시작한 과제'],[done.length,'완료한 과제'],[avg(done.filter(r=>r.condition==='비교군').map(r=>r.decision_time_s)),'비교군 평균 결정 시간(초)'],[avg(done.filter(r=>r.condition==='P1').map(r=>r.decision_time_s)),'P1 평균 결정 시간(초)']].map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');
  /* 배치표 진행 */
  const plan=LAB.plan;
  const find=(pid,pr,c)=>live.filter(r=>r.pid===pid&&r.product===P[pr].name&&r.condition===CN[c]).sort((a,b)=>(a.status==='완료'?-1:1))[0];
  $('#mx').innerHTML='<tr><th>참여자</th><th>구매 판단 과제 1</th><th>구매 판단 과제 2</th></tr>'+Object.entries(plan).map(([pid,sl])=>`<tr><td>${pid}</td>${sl.map(([pr,c])=>{const r=find(pid,pr,c);return `<td><div class="cell"><span>${nameOf(pr)} <span class="badge ${c==='p1'?'p1':''}">${CN[c]}</span></span>${badge(r&&r.status)}${r&&r.choice?`<span>${r.choice}, ${r.decision_time_s}초</span>`:''}</div></td>`}).join('')}</tr>`).join('');
  /* 세션 표 */
  const pids=[...new Set(SESS.map(r=>r.pid))].sort();const fp=$('#fp'),cur=fp.value;
  fp.innerHTML='<option value="">참여자 전체</option>'+pids.map(p=>`<option ${p===cur?'selected':''}>${p}</option>`).join('');
  const v=visible();
  const cols=[['pid','참여자'],['product','상품'],['condition','조건'],['status','상태'],['choice','선택'],['decision_time_s','결정(초)',1],['reviews_expanded','펼친 리뷰',1],['reviews_viewed_1s','본 리뷰',1],['ai_toggle_clicks','AI 숨기기',1],['chip_clicks','선택칩',1],['temp_taps','온도',1],['filter_used','별점필터',1],['q1','Q1',1],['q2','Q2',1],['q3','Q3',1],['q4','Q4',1],['updated_at','갱신']];
  $('#tbl').innerHTML=v.length?'<tr>'+cols.map(c=>`<th>${c[1]}</th>`).join('')+'<th></th></tr>'+v.map(r=>`<tr class="click ${r.sid===sel?'sel':''}" data-sid="${r.sid}">${cols.map(([k,,n])=>`<td class="${n?'n':''}">${k==='status'?badge(r[k]):k==='condition'?`<span class="badge ${r[k]==='P1'?'p1':''}">${r[k]}</span>`:k==='updated_at'?fmt(r[k]):(r[k]??'')}</td>`).join('')}<td><button class="b sm" data-hide="${r.sid}" title="파일럿이나 테스트 기록을 분석에서 제외">${r.status==='제외'?'제외됨':'제외'}</button></td></tr>`).join(''):`<tr><td class="empty">${LAB.gasUrl()?'아직 기록이 없어요':'저장 주소를 설정하면 기록이 보여요'}</td></tr>`;
  renderLinks();
}
function showEvents(sid){
  sel=sid;renderAll();const d=$('#detail');d.innerHTML='<p class="msg">행동 로그를 불러오는 중</p>';
  api({action:'events',sid}).then(j=>{
    const r=SESS.find(x=>x.sid===sid)||{};
    const rows=(j.rows||[]).sort((a,b)=>a.t-b.t);
    d.innerHTML=`<h2 style="margin:16px 0 4px;font-size:15px">${r.pid} ${nameOf(Object.keys(P).find(k=>P[k].name===r.product)||r.product)} ${r.condition} <small style="font-weight:500;color:#8b93a1">이벤트 ${rows.length}건</small></h2>${r.open1||r.open2?`<p class="msg">도움/불편: ${r.open1||'-'}<br>바꾸고 싶은 점: ${r.open2||'-'}</p>`:''}<div class="tl"><table><tr><th>시간(초)</th><th>행동</th><th>리뷰</th><th>값</th><th>세부</th></tr>${rows.map(e=>`<tr><td class="n">${e.t}</td><td>${e.type}</td><td>${e.review||''}</td><td>${e.value||''}</td><td style="color:#8b93a1;font-size:12px">${e.detail||''}</td></tr>`).join('')}</table></div>`;
  }).catch(e=>d.innerHTML=`<p class="msg err">${e.message}</p>`);
}
function csv(rows,name){
  if(!rows.length){alert('내려받을 기록이 없어요');return}
  const k=[...new Set(rows.flatMap(r=>Object.keys(r)))],esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const blob=new Blob(['﻿'+k.join(',')+'\n'+rows.map(r=>k.map(x=>esc(r[x])).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function renderLinks(){
  const root=location.href.replace(/admin\.html.*$/,'');const g=LAB.gasUrl();
  const items=[['실험 시작 화면',root+'index.html']];
  if(g)items.push(['기기 설정 링크 (실험 폰에서 한 번 열기)',root+'index.html?gs='+encodeURIComponent(g)]);
  Object.keys(P).forEach(p=>Object.keys(CN).forEach(c=>items.push([`${P[p].name} ${CN[c]} 미리보기`,`${root}${p}-${c}.html?pid=TEST`])));
  $('#links').innerHTML=items.map(([l,u])=>`<div class="lk"><span title="${u}">${l}</span><a class="b sm" href="${u}" target="_blank" rel="noopener">열기</a><button class="b sm" data-copy="${u}">복사</button></div>`).join('');
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-copy],[data-hide],tr.click,#refresh,#save,#dls,#dle');if(!t)return;
  if(t.dataset.copy){navigator.clipboard.writeText(t.dataset.copy).then(()=>{t.textContent='복사됨';setTimeout(()=>t.textContent='복사',1200)})}
  else if(t.dataset.hide){e.stopPropagation();if(confirm('이 기록을 분석에서 제외할까요? 시트의 상태가 "제외"로 바뀝니다.'))api({action:'hide',sid:t.dataset.hide}).then(load)}
  else if(t.dataset.sid)showEvents(t.dataset.sid);
  else if(t.id==='refresh')load();
  else if(t.id==='dls')csv(visible(),'sessions.csv');
  else if(t.id==='dle')api({action:'events',fresh:1}).then(j=>csv((j.rows||[]).filter(r=>{const s=SESS.find(x=>x.sid===r.sid);return !s||s.status!=='제외'}),'events.csv')).catch(err=>alert(err.message));
  else if(t.id==='save'){
    const u=$('#gas').value.trim(),k=$('#key').value.trim(),m=$('#smsg');
    if(u)LS.set('lab_gas_url',u);else LS.del('lab_gas_url');
    LS.set('lab_admin_key',k);
    if(!LAB.gasUrl()){m.className='msg err';m.textContent='주소를 넣어 주세요';return}
    m.className='msg';m.textContent='연결 확인 중';
    LAB.get({action:'ping'}).then(j=>{if(!j.ok)throw 0;m.className='msg ok';m.textContent=`연결됨: ${j.name}`;const a=$('#sheet');a.href=j.sheet;a.hidden=false;load()}).catch(()=>{m.className='msg err';m.textContent='연결하지 못했어요. 주소와 배포 권한(모든 사용자)을 확인해 주세요.'});
  }
});
['#fp','#fc','#fs'].forEach(s=>$(s).addEventListener('change',renderAll));
if(LAB.gasUrl())LAB.get({action:'ping'}).then(j=>{if(j.ok){const a=$('#sheet');a.href=j.sheet;a.hidden=false}}).catch(()=>{});
load();setInterval(()=>{if(document.visibilityState==='visible'&&LAB.gasUrl())load()},30000);
</script>
</body>
</html>
