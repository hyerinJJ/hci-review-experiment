<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>리뷰 화면 사용성 실험</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="config.js?v=9"></script>
<script src="lab.js?v=9"></script>
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#111827;--tx2:#5b6472;--tx3:#8b93a1;--ln:#e3e7ed;--pri:#4168f6;--pri-bg:#edf1ff;--ok:#1f8a4c;--ok-bg:#e7f6ec;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.01em}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:28px 18px 40px}
.eyebrow{font-size:13px;font-weight:700;color:var(--pri)}
h1{margin:4px 0 6px;font-size:25px;line-height:1.3;letter-spacing:-.03em}
.lead{margin:0;color:var(--tx2);font-size:14.5px}
.card{margin-top:16px;padding:18px;border-radius:16px;background:var(--card);box-shadow:0 1px 2px rgba(17,24,39,.04)}
.st{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:15px;font-weight:800}
.st i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#111827;color:#fff;font-style:normal;font-size:12px}
.pids{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pid{height:48px;border:1.5px solid var(--ln);border-radius:12px;font-size:18px;font-weight:800;background:#fff}
.pid.on{border-color:var(--pri);background:var(--pri-bg);color:var(--pri)}
.custom{display:flex;gap:8px;margin-top:10px}
.custom input{flex:1;height:44px;padding:0 12px;border:1.5px solid var(--ln);border-radius:12px;background:#fff;font-size:15px}
.custom input:focus{border-color:var(--pri);outline:0}
.plan{margin-top:14px;display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border:1px solid var(--ln);border-radius:14px;background:#fff;text-align:left;width:100%}
.slot img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:#eee}
.slot .t{flex:1;min-width:0}
.slot .t small{display:block;color:var(--tx3);font-size:12.5px;font-weight:700}
.slot .t b{display:block;font-size:16px}
.tag{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:6px;background:#f1f3f6;color:var(--tx2);font-size:12.5px;font-weight:700;vertical-align:1px}
.tag.p1{background:#f2edff;color:#5a2bbf}
.go{flex:none;display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:10px;background:var(--pri);color:#fff;font-size:14px;font-weight:700}
.slot.done .go{background:var(--ok-bg);color:var(--ok)}
.hint{margin:10px 0 0;color:var(--tx3);font-size:13px}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prod{display:flex;flex-direction:column;align-items:stretch;padding:6px 6px 10px;border:1.5px solid var(--ln);border-radius:14px;background:#fff;text-align:center}
.prod img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#eee}
.prod span{margin-top:7px;font-size:14px;font-weight:700}
.prod.on{border-color:var(--pri);background:var(--pri-bg)}
.prod.on span{color:var(--pri)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:12px;padding:4px;border-radius:12px;background:#eef0f4}
.seg button{height:44px;border-radius:9px;font-size:15px;font-weight:700;color:var(--tx2)}
.seg button.on{background:#fff;color:#111;box-shadow:0 1px 3px rgba(17,24,39,.12)}
.seg button small{display:block;font-size:11.5px;font-weight:500;color:var(--tx3);line-height:1.2}
.start{display:block;width:100%;height:54px;margin-top:14px;border-radius:14px;background:#111827;color:#fff;font-size:17px;font-weight:800}
.start:disabled{background:#c9ced6}
.sum{margin:10px 0 0;font-size:14px;color:var(--tx2);text-align:center;min-height:21px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding:0 4px;font-size:13px;color:var(--tx3)}
.dot{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:#c2c8d0;vertical-align:1px}
.dot.ok{background:#22a35a}
.foot a{color:var(--tx3)}
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow">HCI 1조 Skim &amp; Trust</div>
  <h1>리뷰 화면 사용성 실험</h1>
  <p class="lead">참여자를 고르고 진행할 실험을 선택하면 해당 화면으로 넘어갑니다.</p>

  <section class="card" aria-labelledby="h1s">
    <h2 class="st" id="h1s"><i>1</i>참여자</h2>
    <div class="pids" id="pids" role="radiogroup" aria-label="참여자"></div>
    <div class="custom"><input id="pidin" placeholder="직접 입력 (예: 파일럿 T1)" autocomplete="off" aria-label="참여자 번호 직접 입력"></div>
    <div id="planbox"></div>
  </section>

  <section class="card" aria-labelledby="h2s">
    <h2 class="st" id="h2s"><i>2</i>실험 선택</h2>
    <div class="prods" id="prods" role="radiogroup" aria-label="상품"></div>
    <div class="seg" id="conds" role="radiogroup" aria-label="화면 조건"></div>
    <button class="start" id="start" disabled>실험 시작</button>
    <p class="sum" id="sum" aria-live="polite"></p>
  </section>

  <div class="foot"><span id="conn"><span class="dot"></span>확인 중</span><a href="admin.html">관리자</a></div>
</main>
<script>
const P=LAB.PRODUCTS,CN=LAB.CONDS,$=s=>document.querySelector(s);
const st={pid:LAB.pid||LAB.LS.get('lab_last_pid')||'',prod:'',cond:''};
const CDESC={base:'기존 쿠팡 화면',p1:'Skim & Trust'};
function done(pid,prod,cond){return LAB.doneList().some(d=>d.pid===pid&&d.product===P[prod].name&&d.condition===CN[cond])}
function render(){
  $('#pids').innerHTML=Object.keys(LAB.plan).map(k=>`<button class="pid ${st.pid===k?'on':''}" role="radio" aria-checked="${st.pid===k}" data-pid="${k}">${k}</button>`).join('');
  const inPlan=!!LAB.plan[st.pid];
  if(!inPlan&&document.activeElement!==$('#pidin'))$('#pidin').value=st.pid;
  if(inPlan&&document.activeElement!==$('#pidin'))$('#pidin').value='';
  const pl=LAB.plan[st.pid];
  $('#planbox').innerHTML=pl?`<div class="plan">${pl.map(([pr,c],i)=>{const d=done(st.pid,pr,c);return `<button class="slot ${d?'done':''}" data-go="${pr},${c},${i+1}"><img src="${P[pr].img}" alt=""><span class="t"><small>구매 판단 과제 ${i+1}</small><b>${P[pr].name}<span class="tag ${c}">${CN[c]}</span></b></span><span class="go">${d?'완료':'시작'}</span></button>`}).join('')}</div><p class="hint">배치표대로 진행하려면 과제를 누르세요. 다른 조합은 아래에서 고를 수 있어요.</p>`:'';
  $('#prods').innerHTML=Object.entries(P).map(([k,p])=>`<button class="prod ${st.prod===k?'on':''}" role="radio" aria-checked="${st.prod===k}" data-prod="${k}"><img src="${p.img}" alt=""><span>${p.name}</span></button>`).join('');
  $('#conds').innerHTML=Object.entries(CN).map(([k,n])=>`<button class="${st.cond===k?'on':''}" role="radio" aria-checked="${st.cond===k}" data-cond="${k}">${n}<small>${CDESC[k]}</small></button>`).join('');
  const ok=st.pid&&st.prod&&st.cond;
  $('#start').disabled=!ok;
  $('#sum').textContent=!st.pid?'참여자를 먼저 골라 주세요':ok?`참여자 ${st.pid}, ${P[st.prod].name}, ${CN[st.cond]}${done(st.pid,st.prod,st.cond)?' (이 기기에서 이미 진행함)':''}`:'상품과 조건을 골라 주세요';
}
function go(prod,cond,slot){
  if(!st.pid){$('#sum').textContent='참여자를 먼저 골라 주세요';return}
  LAB.LS.set('lab_last_pid',st.pid);
  location.href=`${prod}-${cond}.html?pid=${encodeURIComponent(st.pid)}${slot?'&slot='+slot:''}`;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.pid){st.pid=t.dataset.pid;render()}
  else if(t.dataset.prod){st.prod=t.dataset.prod;render()}
  else if(t.dataset.cond){st.cond=t.dataset.cond;render()}
  else if(t.dataset.go){const [p,c,i]=t.dataset.go.split(',');go(p,c,i)}
  else if(t.id==='start')go(st.prod,st.cond,'');
});
$('#pidin').addEventListener('input',e=>{st.pid=e.target.value.trim();render()});
render();
/* 저장 연결 확인 */
(function(){
  const u=LAB.gasUrl(),c=$('#conn');
  if(!u){c.innerHTML='<span class="dot"></span>기록 저장 주소 미설정 (관리자 화면에서 설정)';return}
  LAB.get({action:'ping'}).then(j=>{c.innerHTML=j.ok?'<span class="dot ok"></span>구글 시트에 자동 기록 중':'<span class="dot"></span>시트 연결 확인 필요'}).catch(()=>{c.innerHTML='<span class="dot"></span>시트 연결 확인 필요'});
})();
</script>
</body>
</html>
